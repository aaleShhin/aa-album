<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Трек — KAZANUS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; background: #0d0d0f; color: #f5f5f7;
    font-family: 'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif;
    padding: 60px 20px 80px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  .back {
    display: inline-block; color: #8a8a92; text-decoration: none;
    font-size: 0.9rem; margin-bottom: 30px;
    transition: color 0.2s, transform 0.2s;
  }
  .back:hover { color: #f5f5f7; transform: translateX(-4px); }

  .cover {
    width: 100%; max-width: 320px; aspect-ratio: 1/1;
    margin: 0 auto 30px; border-radius: 12px;
    overflow: hidden; position: relative;
    background: linear-gradient(135deg, #2a2a30, #16161a);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
    font-size: 3rem; color: #8a8a92;
  }
  .cover img {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: cover;
    display: block; z-index: 1;
  }

  h1 {
    font-size: clamp(1.5rem, 4.5vw, 2.2rem); font-weight: 900;
    letter-spacing: -0.02em; text-align: center; margin-bottom: 8px;
  }
  .sub { text-align: center; color: #8a8a92; font-size: 0.95rem; margin-bottom: 30px; }

  audio {
    width: 100%; margin-bottom: 40px;
    border-radius: 12px; outline: none;
    filter: invert(0.9) hue-rotate(180deg);
  }

  .lyrics-title {
    font-size: 0.75rem; text-transform: uppercase;
    letter-spacing: 0.15em; color: #8a8a92;
    margin-bottom: 16px; text-align: center;
    font-weight: 600;
  }

  .lyrics {
    white-space: pre-line; line-height: 1.9;
    font-size: 1rem; color: #c9c9d1;
    text-align: center; padding: 30px 20px;
    background: #16161a;
    border-radius: 12px;
  }
</style>
</head>
<body>

    <p class="sub" id="artist"></p>
    <audio id="player" controls preload="metadata"></audio>
    <div class="lyrics-title">Текст песни</div>
    <div class="lyrics" id="lyrics">Загрузка…</div>
  </div>
