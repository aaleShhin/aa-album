<script>
  const TRACKS = {
    1: { title: "HOTEL ремейк 4 146Cmin", artist: "AALESHIN, paradeev", cover: "01",
         lyrics: `Твой текст...` },
    2: { title: "alabama Em95", artist: "AALESHIN, paradeev", cover: "02", lyrics: `...` },
    // ... остальные треки
  };

  const params = new URLSearchParams(location.search);
  const id = params.get("id") || "1";
  const track = TRACKS[id];

  if (!track) {
    document.getElementById("title").textContent = "Трек не найден";
    document.getElementById("lyrics").textContent = "Вернись к списку треков.";
    document.querySelector(".cover").style.display = "none";
    document.getElementById("player").style.display = "none";
  } else {
    document.title = track.title + " — AA ALBUM.KZ";
    document.getElementById("cover").textContent = track.cover;
    document.getElementById("title").textContent = track.title;
    document.getElementById("artist").textContent = track.artist;
    document.getElementById("lyrics").textContent = track.lyrics;

    const player = document.getElementById("player");
    const num = id;                                // "1", "2", ...
    const candidates = [
      `track${num}.mp3`,                           // корень
      `tracks/track${num}.mp3`,                    // папка tracks
      `./track${num}.mp3`,
      `./tracks/track${num}.mp3`
    ];

    let i = 0;
    function tryNext() {
      if (i >= candidates.length) {
        console.error("Не нашёл mp3 ни по одному пути:", candidates);
        return;
      }
      const url = candidates[i++];
      fetch(url, { method: "HEAD" })
        .then(r => {
          if (r.ok) {
            player.src = url;
            console.log("✅ mp3 найден:", url);
          } else {
            tryNext();
          }
        })
        .catch(tryNext);
    }
    tryNext();
  }
</script>
