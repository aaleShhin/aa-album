<!DOCTYPE html>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; background: #0a0a0f; color: #fff;
    font-family: 'Segoe UI', system-ui, sans-serif;

  }
  body::before {
    content: ''; position: fixed; inset: -50%;

      radial-gradient(circle at 75% 80%, rgba(255,80,180,0.18), transparent 45%);
    z-index: 0; pointer-events: none;
  }
  .wrap { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; }
  .back {
    display: inline-block; color: #a78bfa; text-decoration: none;
    font-size: 0.95rem; margin-bottom: 30px; opacity: 0.8;
    transition: opacity 0.2s, transform 0.2s;
  }
  .back:hover { opacity: 1; transform: translateX(-4px); }

  .cover {
    width: 100%; max-width: 320px; aspect-ratio: 1/1;
    margin: 0 auto 30px; border-radius: 20px;
    background: linear-gradient(135deg, #a78bfa, #f472b6, #38bdf8);
    box-shadow: 0 20px 60px rgba(167,139,250,0.35);
    display: flex; align-items: center; justify-content: center;
    font-size: 4rem; font-weight: 900; color: rgba(10,10,15,0.85);
  }
  h1 {
    font-size: clamp(1.6rem, 5vw, 2.4rem); font-weight: 900;
    letter-spacing: 0.05em; text-align: center; margin-bottom: 8px;
  }
  .sub { text-align: center; color: #9ca3af; font-size: 1rem; margin-bottom: 30px; }
  audio {
    width: 100%; margin-bottom: 40px;
    border-radius: 12px; outline: none;
    filter: invert(0.9) hue-rotate(180deg);
  }
  .lyrics-title {
    font-size: 0.85rem; text-transform: uppercase;
    letter-spacing: 0.2em; color: #a78bfa;
    margin-bottom: 16px; text-align: center;
  }
  .lyrics {
    white-space: pre-line; line-height: 1.9;
    font-size: 1.05rem; color: #d1d5db;
    text-align: center; padding: 30px 20px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 16px;
  }
</style>
</head>
<body>
  <div class="wrap">

  const track = TRACKS[id];

  if (!track) {
    document.getElementById("title").textContent = "Трек не найден";
    document.getElementById("lyrics").textContent = "Вернись к списку треков.";
    document.querySelector(".cover").style.display = "none";

    document.title = track.title + " — AA ALBUM.KZ";
    document.getElementById("cover").textContent = track.cover;
    document.getElementById("title").textContent = track.title;
    document.getElementById("artist").textContent = track.artist;
    document.getElementById("lyrics").textContent = track.lyrics;
    document.getElementById("player").src = track.audio;

</html>
