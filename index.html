 <script>
const listEl = document.getElementById("tracks");
listEl.innerHTML = TRACKS.map((t, i) => `
  <div class="track" data-id="${t.id}">
    <div class="track-num">
      <span class="num-text">${i + 1}</span>
      <span class="play-icon">▶</span>
    </div>
    <div class="track-info">
      <div class="track-name">${t.title}</div>
      <div class="track-artist">${t.artist}</div>
    </div>
    <div class="track-duration" data-dur>--:--</div>
    <button class="lyrics-btn" data-lyrics="${t.id}" title="Текст песни">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 6h16M4 12h16M4 18h10"/>
      </svg>
    </button>
  </div>
`).join("");

function fmtDuration(sec) {
  if (!sec || isNaN(sec) || !isFinite(sec)) return "--:--";
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60).toString().padStart(2, "0");
  return m + ":" + s;
}
TRACKS.forEach(t => {
  const probe = document.createElement("audio");
  probe.preload = "metadata";
  probe.src = t.audio;
  probe.addEventListener("loadedmetadata", () => {
    const el = document.querySelector(`.track[data-id="${t.id}"] [data-dur]`);
    if (el) el.textContent = fmtDuration(probe.duration);
  });
});

const audio = document.getElementById("audio");
const player = document.getElementById("player");
const playBtn = document.getElementById("playBtn");
const npTitle = document.getElementById("npTitle");
const npArtist = document.getElementById("npArtist");
const seek = document.getElementById("seek");
const curTime = document.getElementById("curTime");
const durTime = document.getElementById("durTime");
const volume = document.getElementById("volume");
const overlay = document.getElementById("overlay");
const lyricsPanel = document.getElementById("lyricsPanel");
const lpTitle = document.getElementById("lpTitle");
const lpArtist = document.getElementById("lpArtist");
const lpBody = document.getElementById("lpBody");

let currentIndex = -1;
let openLyricsId = null;

function setPlayIcon() {
  document.getElementById("playIcon").innerHTML = '<path d="M8 5v14l11-7z"/>';
}
function setPauseIcon() {
  document.getElementById("playIcon").innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
}

function fmt(s) {
  if (!s || isNaN(s)) return "0:00";
  const m = Math.floor(s / 60);
  const r = Math.floor(s % 60).toString().padStart(2, "0");
  return m + ":" + r;
}

function playTrack(i) {
  if (i < 0 || i >= TRACKS.length) return;
  currentIndex = i;
  const t = TRACKS[i];
  audio.src = t.audio;
  audio.play().catch(e => console.error("Не удалось воспроизвести:", e));
  npTitle.textContent = t.title;
  npArtist.textContent = t.artist;
  player.classList.add("visible");
  setPauseIcon();

  document.querySelectorAll(".track").forEach(el => el.classList.remove("active"));
  const active = document.querySelector(`.track[data-id="${t.id}"]`);
  if (active) active.classList.add("active");

  if (openLyricsId === t.id) {
    lpTitle.textContent = t.title;
    lpArtist.textContent = t.artist;
    lpBody.textContent = t.lyrics;
  }
}

function togglePlay() {
  if (currentIndex < 0) { playTrack(0); return; }
  if (audio.paused) { audio.play(); setPauseIcon(); }
  else { audio.pause(); setPlayIcon(); }
}

function nextTrack() {
  if (currentIndex < 0) return playTrack(0);
  playTrack((currentIndex + 1) % TRACKS.length);
}

function prevTrack() {
  if (currentIndex < 0) return playTrack(0);
  playTrack((currentIndex - 1 + TRACKS.length) % TRACKS.length);
}

function playFirst() { playTrack(0); }

function openLyrics(id) {
  const t = TRACKS.find(x => x.id === id);
  if (!t) return;
  openLyricsId = id;
  lpTitle.textContent = t.title;
  lpArtist.textContent = t.artist;
  lpBody.textContent = t.lyrics;
  lyricsPanel.classList.add("open");
  overlay.classList.add("visible");
  document.querySelectorAll(".lyrics-btn").forEach(b => {
    b.classList.toggle("active", Number(b.dataset.lyrics) === id);
  });
}

function closeLyrics() {
  openLyricsId = null;
  lyricsPanel.classList.remove("open");
  overlay.classList.remove("visible");
  document.querySelectorAll(".lyrics-btn").forEach(b => b.classList.remove("active"));
}

document.querySelectorAll(".track").forEach((el, i) => {
  el.addEventListener("click", (e) => {
    if (e.target.closest(".lyrics-btn")) return;
    if (currentIndex === i) togglePlay();
    else playTrack(i);
  });
});

document.querySelectorAll(".lyrics-btn").forEach(btn => {
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    const id = Number(btn.dataset.lyrics);
    if (openLyricsId === id) closeLyrics();
    else openLyrics(id);
  });
});

audio.addEventListener("timeupdate", () => {
  if (audio.duration) {
    seek.value = (audio.currentTime / audio.duration) * 100;
    curTime.textContent = fmt(audio.currentTime);
    durTime.textContent = fmt(audio.duration);
  }
});

audio.addEventListener("ended", nextTrack);
seek.addEventListener("input", () => {
  if (audio.duration) audio.currentTime = (seek.value / 100) * audio.duration;
});
volume.addEventListener("input", () => { audio.volume = volume.value; });

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeLyrics();
  if (e.code === "Space" && e.target.tagName !== "INPUT") {
    e.preventDefault();
    togglePlay();
  }
});
</script>
