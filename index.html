<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAZANUS — ALBUM</title>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Cormorant+Garamond:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0708;
    --bg-2: #120c0e;
    --bg-3: #1a1114;
    --text: #e8dfd3;
    --text-2: #8a7f72;
    --accent: #8b0000;
    --accent-2: #c9a227;
    --border: rgba(201, 162, 39, 0.15);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Cormorant Garamond', Georgia, serif;
    min-height: 100vh;
    padding-bottom: 100px;
    position: relative;
    overflow-x: hidden;
  }

  /* Тонкая текстура-зерно */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1;
    mix-blend-mode: overlay;
  }

  /* Виньетка по краям */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(0,0,0,0.85) 100%);
    pointer-events: none;
    z-index: 2;
  }

  header {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 24px 40px;
    border-bottom: 1px solid var(--border);
  }

  .logo {
    font-family: 'UnifrakturMaguntia', serif;
    font-size: 1.6rem;
    color: var(--accent-2);
    text-decoration: none;
    letter-spacing: 0.02em;
    text-shadow: 0 0 20px rgba(201, 162, 39, 0.4);
    flex-shrink: 0;
  }
  .logo span { color: var(--accent); }

  .search {
    flex: 1;
    max-width: 500px;
    display: flex;
    align-items: center;
    background: var(--bg-3);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 10px 16px;
    gap: 10px;
    margin-left: auto;
  }
  .search input {
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 0.95rem;
    width: 100%;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
  }
  .search input::placeholder { color: var(--text-2); }
  .search svg { opacity: 0.5; flex-shrink: 0; }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 48px 40px;
    position: relative;
    z-index: 5;
  }

  /* ================== АЛЬБОМ ================== */
  .album-head {
    display: flex;
    gap: 40px;
    align-items: flex-end;
    margin-bottom: 56px;
    position: relative;
  }

  .album-cover {
    width: 240px;
    height: 240px;
    border-radius: 2px;
    overflow: hidden;
    flex-shrink: 0;
    background:
      linear-gradient(135deg, #2a0a0a, #12080a 60%),
      radial-gradient(circle at 30% 30%, #5c0000, transparent 60%);
    border: 1px solid var(--accent-2);
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.6) inset,
      0 20px 60px rgba(139, 0, 0, 0.4),
      0 0 80px rgba(201, 162, 39, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'UnifrakturMaguntia', serif;
    font-size: 5rem;
    color: var(--accent-2);
    position: relative;
  }
  .album-cover img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    position: relative; z-index: 1;
  }

  .album-meta { flex: 1; min-width: 0; }

  .album-label {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.4em;
    color: var(--accent-2);
    margin-bottom: 12px;
    font-weight: 600;
  }

  .album-title {
    font-family: 'UnifrakturMaguntia', serif;
    font-size: clamp(2.5rem, 6vw, 5rem);
    font-weight: 400;
    line-height: 0.95;
    margin-bottom: 16px;
    color: var(--text);
    text-shadow:
      0 0 30px rgba(201, 162, 39, 0.3),
      0 0 60px rgba(139, 0, 0, 0.4);
    letter-spacing: 0.02em;
  }
  .album-title em {
    color: var(--accent);
    font-style: normal;
  }

  .album-artist {
    color: var(--text-2);
    font-size: 1.15rem;
    margin-bottom: 28px;
    font-style: italic;
    letter-spacing: 0.05em;
  }

  .play-big {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: transparent;
    color: var(--accent-2);
    border: 1px solid var(--accent-2);
    border-radius: 2px;
    padding: 12px 32px;
    font-size: 1rem;
    font-weight: 600;
    font-family: 'Cormorant Garamond', serif;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
  }
  .play-big:hover {
    background: var(--accent-2);
    color: #0a0708;
    box-shadow: 0 0 40px rgba(201, 162, 39, 0.5);
  }

  /* ================== СПИСОК ТРЕКОВ ================== */
  .divider {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 24px;
    color: var(--accent-2);
    font-size: 0.8rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
  }
  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
  }
  .divider .ornament {
    font-family: 'UnifrakturMaguntia', serif;
    font-size: 1.4rem;
    letter-spacing: 0.2em;
  }

  .track {
    display: grid;
    grid-template-columns: 50px 1fr 100px 50px;
    gap: 20px;
    align-items: center;
    padding: 14px 16px;
    border-bottom: 1px solid rgba(201, 162, 39, 0.08);
    text-decoration: none;
    color: inherit;
    cursor: pointer;
    transition: background 0.2s, padding 0.2s;
    position: relative;
  }
  .track:hover {
    background: rgba(139, 0, 0, 0.08);
    padding-left: 24px;
  }
  .track::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
    background: var(--accent);
    transform: scaleY(0);
    transition: transform 0.25s;
  }
  .track:hover::before,
  .track.active::before { transform: scaleY(1); }

  .track.active { background: rgba(139, 0, 0, 0.12); }
  .track.active .track-name {
    color: var(--accent-2);
    text-shadow: 0 0 20px rgba(201, 162, 39, 0.4);
  }

  .track-num {
    font-family: 'UnifrakturMaguntia', serif;
    font-size: 1.4rem;
    color: var(--text-2);
    text-align: center;
    height: 26px;
    position: relative;
    line-height: 26px;
  }
  .track-num .num-text { display: block; }
  .track-num .play-icon {
    display: none;
    line-height: 26px;
    font-size: 1rem;
    color: var(--accent-2);
  }
  .track:hover .track-num .num-text { display: none; }
  .track:hover .track-num .play-icon { display: block; }
  .track.active .track-num .num-text { display: none; }
  .track.active .track-num .play-icon { display: block; }

  .track-info { min-width: 0; }

  .track-name {
    font-size: 1.25rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
    transition: color 0.2s;
  }

  .track-artist {
    font-size: 0.9rem;
    color: var(--text-2);
    font-style: italic;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: 0.05em;
  }

  .track-duration {
    font-size: 0.95rem;
    color: var(--text-2);
    text-align: right;
    font-style: italic;
  }

  .track-ornament {
    text-align: right;
    color: var(--accent);
    font-family: 'UnifrakturMaguntia', serif;
    font-size: 1.1rem;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .track:hover .track-ornament { opacity: 0.6; }

  /* ================== НИЖНИЙ ПЛЕЕР ================== */
  .player {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 92px;
    background: linear-gradient(180deg, rgba(18,12,14,0.98), rgba(10,7,8,0.98));
    border-top: 1px solid var(--accent-2);
    box-shadow: 0 -20px 60px rgba(0,0,0,0.8);
    display: grid;
    grid-template-columns: 1fr 2fr 1fr;
    align-items: center;
    gap: 24px;
    padding: 0 32px;
    z-index: 100;
    transform: translateY(100%);
    transition: transform 0.4s ease;
  }
  .player.visible { transform: translateY(0); }

  .now-playing {
    display: flex;
    align-items: center;
    gap: 16px;
    min-width: 0;
  }
  .now-cover {
    width: 56px; height: 56px;
    border-radius: 2px;
    background: linear-gradient(135deg, #2a0a0a, #12080a);
    border: 1px solid var(--accent-2);
    flex-shrink: 0;
    overflow: hidden;
  }
  .now-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .now-info { min-width: 0; }
  .now-title {
    font-size: 1.05rem; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: var(--text);
  }
  .now-artist {
    font-size: 0.85rem; color: var(--text-2);
    font-style: italic;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .controls-buttons {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .ctrl {
    background: transparent; border: none; cursor: pointer;
    color: var(--text); font-size: 1.1rem;
    opacity: 0.7; transition: opacity 0.15s, color 0.15s;
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px;
  }
  .ctrl:hover { opacity: 1; color: var(--accent-2); }

  .play-main {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: transparent;
    border: 1px solid var(--accent-2);
    color: var(--accent-2);
    font-size: 0.9rem;
    opacity: 1;
  }
  .play-main:hover {
    background: var(--accent-2);
    color: #0a0708;
    box-shadow: 0 0 30px rgba(201, 162, 39, 0.6);
  }

  .progress {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 0.8rem;
    color: var(--text-2);
    font-style: italic;
  }
  .progress input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 2px;
    background: rgba(201, 162, 39, 0.2);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  .progress input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--accent-2);
    cursor: pointer;
    box-shadow: 0 0 10px rgba(201, 162, 39, 0.6);
  }
  .progress input[type="range"]::-moz-range-thumb {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--accent-2);
    border: none;
    cursor: pointer;
  }

  .volume {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    color: var(--accent-2);
  }
  .volume input[type="range"] {
    width: 100px;
    -webkit-appearance: none;
    height: 2px;
    background: rgba(201, 162, 39, 0.2);
    border-radius: 2px;
    outline: none;
  }
  .volume input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--accent-2);
    cursor: pointer;
  }
  .volume input[type="range"]::-moz-range-thumb {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--accent-2);
    border: none;
  }

  @media (max-width: 720px) {
    header { padding: 16px; gap: 12px; }
    .logo { font-size: 1.3rem; }
    .container { padding: 24px 16px; }

    .album-head {
      flex-direction: column;
      align-items: flex-start;
      gap: 24px;
      margin-bottom: 36px;
    }
    .album-cover { width: 100%; max-width: 260px; height: auto; aspect-ratio: 1/1; }
    .album-title { font-size: 2.4rem; }

    .track {
      grid-template-columns: 36px 1fr 36px;
      gap: 12px;
      padding: 12px 8px;
    }
    .track-duration { display: none; }
    .track-name { font-size: 1.05rem; }

    .player {
      grid-template-columns: 1fr auto;
      gap: 12px;
      padding: 0 16px;
      height: 76px;
    }
    .progress { display: none; }
    .now-cover { width: 44px; height: 44px; }
    .now-title { font-size: 0.95rem; }
    .volume { display: none; }
    .controls-buttons { gap: 12px; }
  }
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo">Kazanus<span>·</span>Album</a>
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="text" placeholder="Найти в летописи…">
  </div>
</header>

<div class="container">
  <div class="album-head">
    <div class="album-cover">
      ✠
      <img src="cover.jpg" alt="" onerror="this.style.display='none'">
    </div>
    <div class="album-meta">
      <div class="album-label">· Запечатанная летопись ·</div>
      <h1 class="album-title"><em>A</em>lbum <em>A</em>?an<span>·</span></h1>
      <div class="album-artist">KAZANUS · 10 треков · MMXXV</div>
      <button class="play-big" onclick="playFirst()">✦ Слушать ✦</button>
    </div>
  </div>

  <div class="divider">
    <span class="ornament">❦</span>
    <span>Список треков</span>
    <span class="ornament">❦</span>
  </div>

  <div id="tracks"></div>
</div>

<div class="player" id="player">
  <div class="now-playing">
    <div class="now-cover">
      <img src="cover.jpg" alt="" onerror="this.style.display='none'">
    </div>
    <div class="now-info">
      <div class="now-title" id="npTitle">—</div>
      <div class="now-artist" id="npArtist">—</div>
    </div>
  </div>

  <div class="controls">
    <div class="controls-buttons">
      <button class="ctrl" onclick="prevTrack()" title="Назад">⏮</button>
      <button class="ctrl play-main" id="playBtn" onclick="togglePlay()" title="Играть">▶</button>
      <button class="ctrl" onclick="nextTrack()" title="Вперёд">⏭</button>
    </div>
    <div class="progress">
      <span id="curTime">0:00</span>
      <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
      <span id="durTime">0:00</span>
    </div>
  </div>

  <div class="volume">
    <span>🔊</span>
    <input type="range" id="volume" min="0" max="1" value="1" step="0.01">
  </div>
</div>

<audio id="audio"></audio>

<script>
// ================== 10 ТРЕКОВ ==================
const TRACKS = [
  { id: 1,  title: "intro (пво)",                        artist: "KAZANUS", audio: "track1.mp3"  },
  { id: 2,  title: "mister p…",                          artist: "KAZANUS", audio: "track2.mp3"  },
  { id: 3,  title: "TRADUATOR",                          artist: "KAZANUS", audio: "track3.mp3"  },
  { id: 4,  title: "sting (us)",                         artist: "KAZANUS", audio: "track4.mp3"  },
  { id: 5,  title: "trader 2",                           artist: "KAZANUS", audio: "track5.mp3"  },
  { id: 6,  title: "you anus",                           artist: "KAZANUS", audio: "track6.mp3"  },
  { id: 7,  title: "finance swag ft. королевский XVII",  artist: "KAZANUS", audio: "track7.mp3"  },
  { id: 8,  title: "info shot",                          artist: "KAZANUS", audio: "track8.mp3"  },
  { id: 9,  title: "dima double",                        artist: "KAZANUS", audio: "track9.mp3"  },
  { id: 10, title: "le secret d'Alihan",                 artist: "KAZANUS", audio: "track10.mp3" }
];

const listEl = document.getElementById("tracks");
listEl.innerHTML = TRACKS.map((t, i) => `
  <a class="track" data-id="${t.id}" href="track.html?id=${t.id}">
    <div class="track-num">
      <span class="num-text">${String(i + 1).padStart(2, "0")}</span>
      <span class="play-icon">▶</span>
    </div>
    <div class="track-info">
      <div class="track-name">${t.title}</div>
      <div class="track-artist">${t.artist}</div>
    </div>
    <div class="track-duration" data-dur>--:--</div>
    <div class="track-ornament">❧</div>
  </a>
`).join("");

// ================== ПЛЕЕР ==================
const audio = document.getElementById("audio");
const player = document.getElementById("player");
const playBtn = document.getElementById("playBtn");
const npTitle = document.getElementById("npTitle");
const npArtist = document.getElementById("npArtist");
const seek = document.getElementById("seek");
const curTime = document.getElementById("curTime");
const durTime = document.getElementById("durTime");
const volume = document.getElementById("volume");

let currentIndex = -1;

function fmt(s) {
  if (!s || isNaN(s)) return "0:00";
  const m = Math.floor(s / 60);
  const r = Math.floor(s % 60).toString().padStart(2, "0");
  return m + ":" + r;
}

function playTrack(i) {
  if (i < 0 || i >= TRACKS.length) return;
  currentIndex = i;
  const t = TRACKS[i];
  audio.src = t.audio;
  audio.play().catch(e => console.error("Не удалось воспроизвести:", e));
  npTitle.textContent = t.title;
  npArtist.textContent = t.artist;
  player.classList.add("visible");
  playBtn.textContent = "⏸";

  document.querySelectorAll(".track").forEach(el => el.classList.remove("active"));
  const active = document.querySelector(`.track[data-id="${t.id}"]`);
  if (active) active.classList.add("active");
}

function togglePlay() {
  if (currentIndex < 0) { playTrack(0); return; }
  if (audio.paused) {
    audio.play();
    playBtn.textContent = "⏸";
  } else {
    audio.pause();
    playBtn.textContent = "▶";
  }
}

function nextTrack() {
  if (currentIndex < 0) return playTrack(0);
  playTrack((currentIndex + 1) % TRACKS.length);
}

function prevTrack() {
  if (currentIndex < 0) return playTrack(0);
  playTrack((currentIndex - 1 + TRACKS.length) % TRACKS.length);
}

function playFirst() { playTrack(0); }

document.querySelectorAll(".track").forEach((el, i) => {
  el.addEventListener("click", (e) => {
    e.preventDefault();
    if (currentIndex === i) togglePlay();
    else playTrack(i);
  });
  el.addEventListener("dblclick", () => {
    location.href = el.getAttribute("href");
  });
});

audio.addEventListener("timeupdate", () => {
  if (audio.duration) {
    seek.value = (audio.currentTime / audio.duration) * 100;
    curTime.textContent = fmt(audio.currentTime);
    durTime.textContent = fmt(audio.duration);
  }
});

audio.addEventListener("loadedmetadata", () => {
  durTime.textContent = fmt(audio.duration);
  if (currentIndex >= 0) {
    const el = document.querySelector(`.track[data-id="${TRACKS[currentIndex].id}"] [data-dur]`);
    if (el) el.textContent = fmt(audio.duration);
  }
});

audio.addEventListener("ended", nextTrack);

seek.addEventListener("input", () => {
  if (audio.duration) audio.currentTime = (seek.value / 100) * audio.duration;
});

volume.addEventListener("input", () => {
  audio.volume = volume.value;
});

document.addEventListener("keydown", (e) => {
  if (e.code === "Space" && e.target.tagName !== "INPUT") {
    e.preventDefault();
    togglePlay();
  }
});
</script>
</body>
</html>
