<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAZANUS — ALBUM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0d0d0f; --bg-2: #16161a; --bg-3: #1e1e23;
    --text: #f5f5f7; --text-2: #8a8a92;
    --accent: #ffdb4d; --border: rgba(255,255,255,0.06);
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh; padding-bottom: 100px;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; gap: 24px;
    padding: 16px 40px;
    background: rgba(13,13,15,0.85);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
  }
  .logo {
    font-size: 1.05rem; font-weight: 900; letter-spacing: 0.02em;
    color: var(--text); text-decoration: none; flex-shrink: 0;
  }
  .logo span { color: var(--accent); }
  .search {
    flex: 1; max-width: 500px;
    display: flex; align-items: center;
    background: var(--bg-3); border-radius: 10px;
    padding: 10px 16px; gap: 10px;
    transition: background 0.2s;
  }
  .search:focus-within { background: #26262c; }
  .search input {
    background: transparent; border: none; outline: none;
    color: var(--text); font-size: 0.9rem; width: 100%; font-family: inherit;
  }
  .search input::placeholder { color: var(--text-2); }
  .search svg { opacity: 0.5; flex-shrink: 0; }
  .container { max-width: 1100px; margin: 0 auto; padding: 40px 40px 60px; }
  .album-head {
    display: flex; gap: 32px; align-items: flex-end; margin-bottom: 44px;
  }
  .album-cover {
    width: 220px; height: 220px; border-radius: 10px;
    overflow: hidden; flex-shrink: 0;
    background: linear-gradient(135deg, #2a2a30, #16161a);
    display: flex; align-items: center; justify-content: center;
    font-size: 3rem; font-weight: 900; color: var(--text-2);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    position: relative;
  }
  .album-cover img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; display: block; z-index: 1;
  }
  .album-meta { flex: 1; min-width: 0; padding-bottom: 4px; }
  .album-label {
    font-size: 0.72rem; text-transform: uppercase;
    letter-spacing: 0.15em; color: var(--text-2);
    margin-bottom: 10px; font-weight: 600;
  }
  .album-title {
    font-size: clamp(2.2rem, 5vw, 3.6rem); font-weight: 900;
    line-height: 1; margin-bottom: 12px; color: var(--text);
    letter-spacing: -0.02em;
  }
  .album-artist { color: var(--text-2); font-size: 0.98rem; margin-bottom: 24px; }
  .play-big {
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--accent); color: #000; border: none;
    border-radius: 10px; padding: 12px 28px;
    font-size: 0.95rem; font-weight: 700; font-family: inherit;
    cursor: pointer; transition: transform 0.15s, background 0.15s;
  }
  .play-big:hover { background: #ffd633; transform: scale(1.03); }
  .tracks-head {
    display: grid; grid-template-columns: 44px 1fr 90px 40px;
    gap: 20px; padding: 0 20px 12px;
    font-size: 0.72rem; text-transform: uppercase;
    letter-spacing: 0.12em; color: var(--text-2);
    border-bottom: 1px solid var(--border); margin-bottom: 6px;
    font-weight: 600;
  }
  .track {
    display: grid; grid-template-columns: 44px 1fr 90px 40px;
    gap: 20px; align-items: center;
    padding: 12px 20px; border-radius: 8px;
    color: inherit; cursor: pointer;
    transition: background 0.15s;
  }
  .track:hover { background: var(--bg-2); }
  .track.active { background: var(--bg-2); }
  .track.active .track-name { color: var(--accent); }
  .track-num {
    font-size: 0.9rem; color: var(--text-2); text-align: center;
    height: 22px; line-height: 22px; position: relative;
    font-variant-numeric: tabular-nums;
  }
  .track-num .num-text { display: block; }
  .track-num .play-icon {
    display: none; line-height: 22px;
    font-size: 0.75rem; color: var(--accent);
  }
  .track:hover .track-num .num-text { display: none; }
  .track:hover .track-num .play-icon { display: block; }
  .track.active .track-num .num-text { display: none; }
  .track.active .track-num .play-icon { display: block; }
  .track-info { min-width: 0; }
  .track-name {
    font-size: 1rem; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: color 0.2s;
  }
  .track-artist {
    font-size: 0.82rem; color: var(--text-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-top: 2px;
  }
  .track-duration {
    font-size: 0.88rem; color: var(--text-2); text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .lyrics-btn {
    display: flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 8px;
    color: var(--text-2); text-decoration: none;
    transition: background 0.15s, color 0.15s;
  }
  .lyrics-btn:hover {
    background: rgba(255,255,255,0.08);
    color: var(--accent);
  }
  .lyrics-btn svg { display: block; }
  .player {
    position: fixed; left: 0; right: 0; bottom: 0;
    height: 86px; background: rgba(22, 22, 26, 0.96);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border-top: 1px solid var(--border);
    display: grid; grid-template-columns: 1fr 2fr 1fr;
    align-items: center; gap: 24px; padding: 0 32px;
    z-index: 100; transform: translateY(100%);
    transition: transform 0.4s ease;
  }
  .player.visible { transform: translateY(0); }
  .now-playing { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .now-cover {
    width: 54px; height: 54px; border-radius: 8px;
    background: linear-gradient(135deg, #2a2a30, #16161a);
    flex-shrink: 0; overflow: hidden; position: relative;
  }
  .now-cover img {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .now-info { min-width: 0; }
  .now-title {
    font-size: 0.94rem; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .now-artist {
    font-size: 0.8rem; color: var(--text-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .controls { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .controls-buttons { display: flex; align-items: center; gap: 22px; }
  .ctrl {
    background: transparent; border: none; cursor: pointer;
    color: var(--text); opacity: 0.75;
    transition: opacity 0.15s, color 0.15s, transform 0.15s;
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; padding: 0;
  }
  .ctrl:hover { opacity: 1; }
  .ctrl:active { transform: scale(0.9); }
  .ctrl svg { display: block; }
  .play-main {
    width: 46px; height: 46px; border-radius: 50%;
    background: var(--accent); color: #000; opacity: 1;
  }
  .play-main:hover { background: #ffd633; }
  .play-main svg { width: 18px; height: 18px; }
  .progress {
    width: 100%; display: flex; align-items: center; gap: 12px;
    font-size: 0.75rem; color: var(--text-2);
    font-variant-numeric: tabular-nums;
  }
  .progress input[type="range"] {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 3px; background: rgba(255,255,255,0.12);
    border-radius: 2px; outline: none; cursor: pointer;
  }
  .progress input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px;
    border-radius: 50%; background: var(--text); cursor: pointer;
  }
  .progress input[type="range"]::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--text); border: none;
  }
  .volume {
    display: flex; align-items: center; justify-content: flex-end;
    gap: 10px; color: var(--text-2); font-size: 0.9rem;
  }
  .volume input[type="range"] {
    width: 90px; -webkit-appearance: none;
    height: 3px; background: rgba(255,255,255,0.12);
    border-radius: 2px; outline: none;
  }
  .volume input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px;
    border-radius: 50%; background: var(--text); cursor: pointer;
  }
  .volume input[type="range"]::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--text); border: none;
  }
  @media (max-width: 720px) {
    header { padding: 14px 16px; gap: 12px; }
    .logo { font-size: 1rem; }
    .container { padding: 24px 16px; }
    .album-head { flex-direction: column; align-items: flex-start; gap: 20px; margin-bottom: 32px; }
    .album-cover { width: 100%; max-width: 240px; height: auto; aspect-ratio: 1/1; }
    .album-title { font-size: 2rem; }
    .tracks-head { display: none; }
    .track { grid-template-columns: 36px 1fr 36px; gap: 12px; padding: 10px 12px; }
    .track-duration { display: none; }
    .player {
      grid-template-columns: 1fr auto; gap: 12px;
      padding: 0 16px; height: 72px;
    }
    .progress { display: none; }
    .now-cover { width: 44px; height: 44px; }
    .now-title { font-size: 0.9rem; }
    .volume { display: none; }
    .controls-buttons { gap: 14px; }
    .ctrl { width: 34px; height: 34px; }
    .play-main { width: 42px; height: 42px; }
    .lyrics-btn { width: 30px; height: 30px; }
  }
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo">AA<span>·</span>ALBUM.KZ</a>
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="text" placeholder="Поиск…">
  </div>
</header>

<div class="container">
  <div class="album-head">
    <div class="album-cover">
      ♪
      <img src="cover.jpg" alt="" onerror="this.style.display='none'">
    </div>
    <div class="album-meta">
      <div class="album-label">Альбом</div>
      <h1 class="album-title">KAZANUS</h1>
      <div class="album-artist">AALESHIN · 10 треков</div>
      <button class="play-big" onclick="playFirst()">▶ Слушать</button>
    </div>
  </div>

  <div class="tracks-head">
    <span>#</span>
    <span>Название</span>
    <span style="text-align:right">Время</span>
    <span></span>
  </div>

  <div id="tracks"></div>
</div>

<div class="player" id="player">
  <div class="now-playing">
    <div class="now-cover">
      <img src="cover.jpg" alt="" onerror="this.style.display='none'">
    </div>
    <div class="now-info">
      <div class="now-title" id="npTitle">—</div>
      <div class="now-artist" id="npArtist">—</div>
    </div>
  </div>

  <div class="controls">
    <div class="controls-buttons">
      <button class="ctrl" onclick="prevTrack()" aria-label="Назад">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/>
        </svg>
      </button>
      <button class="ctrl play-main" id="playBtn" onclick="togglePlay()" aria-label="Играть">
        <svg id="playIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </button>
      <button class="ctrl" onclick="nextTrack()" aria-label="Вперёд">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M16 6h2v12h-2zM6 6v12l8.5-6z"/>
        </svg>
      </button>
    </div>
    <div class="progress">
      <span id="curTime">0:00</span>
      <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
      <span id="durTime">0:00</span>
    </div>
  </div>

  <div class="volume">
    <span>🔊</span>
    <input type="range" id="volume" min="0" max="1" value="1" step="0.01">
  </div>
</div>

<audio id="audio"></audio>

<script>
const TRACKS = [
  { id: 1,  title: "intro (пво)",                        artist: "AALESHIN", audio: "track1.mp3"  },
  { id: 2,  title: "mister p…",                          artist: "AALESHIN", audio: "track2.mp3"  },
  { id: 3,  title: "TRADUATOR",                          artist: "AALESHIN", audio: "track3.mp3"  },
  { id: 4,  title: "sting (us)",                         artist: "AALESHIN", audio: "track4.mp3"  },
  { id: 5,  title: "trader 2",                           artist: "AALESHIN", audio: "track5.mp3"  },
  { id: 6,  title: "you anus",                           artist: "AALESHIN", audio: "track6.mp3"  },
  { id: 7,  title: "finance swag ft. королевский XVII",  artist: "AALESHIN", audio: "track7.mp3"  },
  { id: 8,  title: "info shot",                          artist: "AALESHIN", audio: "track8.mp3"  },
  { id: 9,  title: "dima double",                        artist: "AALESHIN", audio: "track9.mp3"  },
  { id: 10, title: "le secret d'Alihan",                 artist: "AALESHIN", audio: "track10.mp3" }
];

const listEl = document.getElementById("tracks");
listEl.innerHTML = TRACKS.map((t, i) => `
  <div class="track" data-id="${t.id}">
    <div class="track-num">
      <span class="num-text">${i + 1}</span>
      <span class="play-icon">▶</span>
    </div>
    <div class="track-info">
      <div class="track-name">${t.title}</div>
      <div class="track-artist">${t.artist}</div>
    </div>
    <div class="track-duration" data-dur>--:--</div>
    <a class="lyrics-btn" href="track.html?id=${t.id}" title="Текст песни">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 6h16M4 12h16M4 18h10"/>
      </svg>
    </a>
  </div>
`).join("");

function fmtDuration(sec) {
  if (!sec || isNaN(sec) || !isFinite(sec)) return "--:--";
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60).toString().padStart(2, "0");
  return m + ":" + s;
}
TRACKS.forEach(t => {
  const probe = document.createElement("audio");
  probe.preload = "metadata";
  probe.src = t.audio;
  probe.addEventListener("loadedmetadata", () => {
    const el = document.querySelector(`.track[data-id="${t.id}"] [data-dur]`);
    if (el) el.textContent = fmtDuration(probe.duration);
  });
});

const audio = document.getElementById("audio");
const player = document.getElementById("player");
const playBtn = document.getElementById("playBtn");
const npTitle = document.getElementById("npTitle");
const npArtist = document.getElementById("npArtist");
const seek = document.getElementById("seek");
const curTime = document.getElementById("curTime");
const durTime = document.getElementById("durTime");
const volume = document.getElementById("volume");

let currentIndex = -1;

function setPlayIcon() {
  document.getElementById("playIcon").innerHTML = '<path d="M8 5v14l11-7z"/>';
}
function setPauseIcon() {
  document.getElementById("playIcon").innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
}

function fmt(s) {
  if (!s || isNaN(s)) return "0:00";
  const m = Math.floor(s / 60);
  const r = Math.floor(s % 60).toString().padStart(2, "0");
  return m + ":" + r;
}

function playTrack(i) {
  if (i < 0 || i >= TRACKS.length) return;
  currentIndex = i;
  const t = TRACKS[i];
  audio.src = t.audio;
  audio.play().catch(e => console.error("Не удалось воспроизвести:", e));
  npTitle.textContent = t.title;
  npArtist.textContent = t.artist;
  player.classList.add("visible");
  setPauseIcon();

  document.querySelectorAll(".track").forEach(el => el.classList.remove("active"));
  const active = document.querySelector(`.track[data-id="${t.id}"]`);
  if (active) active.classList.add("active");
}

function togglePlay() {
  if (currentIndex < 0) { playTrack(0); return; }
  if (audio.paused) { audio.play(); setPauseIcon(); }
  else { audio.pause(); setPlayIcon(); }
}

function nextTrack() {
  if (currentIndex < 0) return playTrack(0);
  playTrack((currentIndex + 1) % TRACKS.length);
}

function prevTrack() {
  if (currentIndex < 0) return playTrack(0);
  playTrack((currentIndex - 1 + TRACKS.length) % TRACKS.length);
}

function playFirst() { playTrack(0); }

document.querySelectorAll(".track").forEach((el, i) => {
  el.addEventListener("click", (e) => {
    if (e.target.closest(".lyrics-btn")) return;
    if (currentIndex === i) togglePlay();
    else playTrack(i);
  });
});

audio.addEventListener("timeupdate", () => {
  if (audio.duration) {
    seek.value = (audio.currentTime / audio.duration) * 100;
    curTime.textContent = fmt(audio.currentTime);
    durTime.textContent = fmt(audio.duration);
  }
});

audio.addEventListener("ended", nextTrack);
seek.addEventListener("input", () => {
  if (audio.duration) audio.currentTime = (seek.value / 100) * audio.duration;
});
volume.addEventListener("input", () => { audio.volume = volume.value; });

document.addEventListener("keydown", (e) => {
  if (e.code === "Space" && e.target.tagName !== "INPUT") {
    e.preventDefault();
    togglePlay();
  }
});
</script>
</body>
</html>
