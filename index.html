<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAZANUS — ALBUM</title>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0708;
    --bg-2: #100b0d;
    --bg-3: #171013;
    --bg-4: #1f1619;
    --text: #ece5d9;
    --text-2: #7a7269;
    --accent: #b91c1c;
    --accent-2: #d4af37;
    --border: rgba(212, 175, 55, 0.08);
    --border-hover: rgba(212, 175, 55, 0.25);
  }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Cormorant Garamond', Georgia, serif;
    min-height: 100vh;
    padding-bottom: 100px;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Едва заметная текстура */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1;
    mix-blend-mode: overlay;
  }

  /* ================== ШАПКА ================== */
  header {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 18px 40px;
    background: rgba(10,7,8,0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
  }

  .logo {
    font-family: 'UnifrakturMaguntia', serif;
    font-size: 1.5rem;
    color: var(--accent-2);
    text-decoration: none;
    letter-spacing: 0.02em;
    flex-shrink: 0;
    transition: text-shadow 0.3s;
  }
  .logo:hover { text-shadow: 0 0 20px rgba(212, 175, 55, 0.5); }

  .search {
    flex: 1;
    max-width: 520px;
    display: flex;
    align-items: center;
    background: var(--bg-3);
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 10px 16px;
    gap: 10px;
    transition: border-color 0.2s, background 0.2s;
  }
  .search:focus-within {
    border-color: var(--border-hover);
    background: var(--bg-4);
  }
  .search input {
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 0.95rem;
    width: 100%;
    font-family: inherit;
    font-style: italic;
  }
  .search input::placeholder { color: var(--text-2); }
  .search svg { opacity: 0.4; flex-shrink: 0; }

  /* ================== КОНТЕЙНЕР ================== */
  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 40px 60px;
    position: relative;
    z-index: 5;
  }

  /* ================== ХЕДЕР АЛЬБОМА ================== */
  .album-head {
    display: flex;
    gap: 36px;
    align-items: flex-end;
    margin-bottom: 48px;
  }

  .album-cover {
    width: 220px;
    height: 220px;
    border-radius: 4px;
    overflow: hidden;
    flex-shrink: 0;
    background: linear-gradient(135deg, #1a0d0d, #0a0708);
    border: 1px solid var(--border-hover);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'UnifrakturMaguntia', serif;
    font-size: 4.5rem;
    color: var(--accent-2);
    position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  .album-cover img {
    width: 100%; height: 100%; object-fit: cover;
    display: block; position: relative; z-index: 1;
  }

  .album-meta { flex: 1; min-width: 0; padding-bottom: 4px; }

  .album-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.35em;
    color: var(--text-2);
    margin-bottom: 10px;
    font-weight: 600;
  }

  .album-title {
    font-family: 'UnifrakturMaguntia', serif;
    font-size: clamp(2.4rem, 5.5vw, 4rem);
    font-weight: 400;
    line-height: 1;
    margin-bottom: 12px;
    color: var(--text);
    letter-spacing: 0.01em;
  }
  .album-title span { color: var(--accent-2); }

  .album-artist {
    color: var(--text-2);
    font-size: 1rem;
    margin-bottom: 26px;
    font-style: italic;
    letter-spacing: 0.03em;
  }
  .album-artist span {
    color: var(--accent);
    font-style: normal;
  }

  .play-big {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: transparent;
    color: var(--accent-2);
    border: 1px solid var(--accent-2);
    border-radius: 4px;
    padding: 11px 30px;
    font-size: 0.9rem;
    font-weight: 600;
    font-family: inherit;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .play-big:hover {
    background: var(--accent-2);
    color: var(--bg);
    box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
  }

  /* ================== СПИСОК ТРЕКОВ ================== */
  .tracks-head {
    display: grid;
    grid-template-columns: 44px 1fr 90px 40px;
    gap: 20px;
    padding: 0 20px 12px;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.25em;
    color: var(--text-2);
    border-bottom: 1px solid var(--border);
    margin-bottom: 6px;
  }

  .track {
    display: grid;
    grid-template-columns: 44px 1fr 90px 40px;
    gap: 20px;
    align-items: center;
    padding: 12px 20px;
    border-radius: 4px;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
    transition: background 0.15s;
    position: relative;
  }
  .track:hover { background: var(--bg-3); }

  .track.active { background: var(--bg-3); }
  .track.active .track-name {
    color: var(--accent-2);
  }

  .track-num {
    font-family: 'UnifrakturMaguntia', serif;
    font-size: 1.3rem;
    color: var(--text-2);
    text-align: center;
    height: 24px;
    line-height: 24px;
    position: relative;
    transition: color 0.2s;
  }
  .track:hover .track-num { color: var(--accent-2); }

  .track-num .num-text { display: block; }
  .track-num .play-icon {
    display: none;
    line-height: 24px;
    font-size: 0.85rem;
    color: var(--accent-2);
  }
  .track:hover .track-num .num-text { display: none; }
  .track:hover .track-num .play-icon { display: block; }
  .track.active .track-num .num-text { display: none; }
  .track.active .track-num .play-icon { display: block; }

  .track-info { min-width: 0; }

  .track-name {
    font-size: 1.05rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color 0.2s;
  }

  .track-artist {
    font-size: 0.82rem;
    color: var(--text-2);
    font-style: italic;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 1px;
  }

  .track-duration {
    font-size: 0.88rem;
    color: var(--text-2);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .track-ornament {
    text-align: right;
    color: var(--accent);
    font-family: 'UnifrakturMaguntia', serif;
    font-size: 1rem;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .track:hover .track-ornament { opacity: 0.5; }
  .track.active .track-ornament { opacity: 1; color: var(--accent-2); }

  /* ================== ПЛЕЕР ================== */
  .player {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 86px;
    background: rgba(16, 11, 13, 0.96);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-top: 1px solid var(--border-hover);
    display: grid;
    grid-template-columns: 1fr 2fr 1fr;
    align-items: center;
    gap: 24px;
    padding: 0 32px;
    z-index: 100;
    transform: translateY(100%);
    transition: transform 0.4s ease;
  }
  .player.visible { transform: translateY(0); }

  .now-playing {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
  }
  .now-cover {
    width: 54px; height: 54px;
    border-radius: 3px;
    background: linear-gradient(135deg, #1a0d0d, #0a0708);
    border: 1px solid var(--border-hover);
    flex-shrink: 0;
    overflow: hidden;
  }
  .now-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .now-info { min-width: 0; }
  .now-title {
    font-size: 0.98rem; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .now-artist {
    font-size: 0.8rem; color: var(--text-2);
    font-style: italic;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .controls-buttons {
    display: flex;
    align-items: center;
    gap: 22px;
  }
  .ctrl {
    background: transparent; border: none; cursor: pointer;
    color: var(--text); font-size: 1rem;
    opacity: 0.7; transition: opacity 0.15s, color 0.15s;
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px;
  }
  .ctrl:hover { opacity: 1; color: var(--accent-2); }

  .play-main {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: transparent;
    border: 1px solid var(--accent-2);
    color: var(--accent-2);
    font-size: 0.85rem;
    opacity: 1;
  }
  .play-main:hover {
    background: var(--accent-2);
    color: var(--bg);
    box-shadow: 0 0 24px rgba(212, 175, 55, 0.5);
  }

  .progress {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 0.75rem;
    color: var(--text-2);
    font-variant-numeric: tabular-nums;
  }
  .progress input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 2px;
    background: rgba(212, 175, 55, 0.15);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  .progress input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--accent-2);
    cursor: pointer;
    transition: transform 0.15s;
  }
  .progress input[type="range"]:hover::-webkit-slider-thumb {
    transform: scale(1.3);
  }
  .progress input[type="range"]::-moz-range-thumb {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--accent-2);
    border: none;
    cursor: pointer;
  }

  .volume {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    color: var(--text-2);
    font-size: 0.9rem;
  }
  .volume input[type="range"] {
    width: 90px;
    -webkit-appearance: none;
    height: 2px;
    background: rgba(212, 175, 55, 0.15);
    border-radius: 2px;
    outline: none;
  }
  .volume input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--accent-2);
    cursor: pointer;
  }
  .volume input[type="range"]::-moz-range-thumb {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--accent-2);
    border: none;
  }

  /* ================== МОБИЛА ================== */
  @media (max-width: 720px) {
    header { padding: 14px 16px; gap: 12px; }
    .logo { font-size: 1.25rem; }
    .container { padding: 24px 16px; }

    .album-head {
      flex-direction: column;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 32px;
    }
    .album-cover { width: 100%; max-width: 240px; height: auto; aspect-ratio: 1/1; }
    .album-title { font-size: 2.2rem; }

    .tracks-head { display: none; }
    .track {
      grid-template-columns: 36px 1fr 40px;
      gap: 12px;
      padding: 10px 12px;
    }
    .track-duration { display: none; }
    .track-name { font-size: 1rem; }

    .player {
      grid-template-columns: 1fr auto;
      gap: 12px;
      padding: 0 16px;
      height: 72px;
    }
    .progress { display: none; }
    .now-cover { width: 44px; height: 44px; }
    .now-title { font-size: 0.9rem; }
    .volume { display: none; }
    .controls-buttons { gap: 14px; }
  }
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo">Kazanus</a>
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="text" placeholder="Поиск…">
  </div>
</header>

<div class="container">
  <div class="album-head">
    <div class="album-cover">
      ✠
      <img src="cover.jpg" alt="" onerror="this.style.display='none'">
    </div>
    <div class="album-meta">
      <div class="album-label">Альбом</div>
      <h1 class="album-title">KAZAN<span>US</span></h1>
      <div class="album-artist"><span>10 треков</span> · MMXXV</div>
      <button class="play-big" onclick="playFirst()">Слушать</button>
    </div>
  </div>

  <div class="tracks-head">
    <span>#</span>
    <span>Название</span>
    <span style="text-align:right">Время</span>
    <span></span>
  </div>

  <div id="tracks"></div>
</div>

<div class="player" id="player">
  <div class="now-playing">
    <div class="now-cover">
      <img src="cover.jpg" alt="" onerror="this.style.display='none'">
    </div>
    <div class="now-info">
      <div class="now-title" id="npTitle">—</div>
      <div class="now-artist" id="npArtist">—</div>
    </div>
  </div>

  <div class="controls">
    <div class="controls-buttons">
      <button class="ctrl" onclick="prevTrack()">⏮</button>
      <button class="ctrl play-main" id="playBtn" onclick="togglePlay()">▶</button>
      <button class="ctrl" onclick="nextTrack()">⏭</button>
    </div>
    <div class="progress">
      <span id="curTime">0:00</span>
      <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
      <span id="durTime">0:00</span>
    </div>
  </div>

  <div class="volume">
    <span>🔊</span>
    <input type="range" id="volume" min="0" max="1" value="1" step="0.01">
  </div>
</div>

<audio id="audio"></audio>

<script>
const TRACKS = [
  { id: 1,  title: "intro (пво)",                        artist: "KAZANUS", audio: "track1.mp3"  },
  { id: 2,  title: "mister p…",                          artist: "KAZANUS", audio: "track2.mp3"  },
  { id: 3,  title: "TRADUATOR",                          artist: "KAZANUS", audio: "track3.mp3"  },
  { id: 4,  title: "sting (us)",                         artist: "KAZANUS", audio: "track4.mp3"  },
  { id: 5,  title: "trader 2",                           artist: "KAZANUS", audio: "track5.mp3"  },
  { id: 6,  title: "you anus",                           artist: "KAZANUS", audio: "track6.mp3"  },
  { id: 7,  title: "finance swag ft. королевский XVII",  artist: "KAZANUS", audio: "track7.mp3"  },
  { id: 8,  title: "info shot",                          artist: "KAZANUS", audio: "track8.mp3"  },
  { id: 9,  title: "dima double",                        artist: "KAZANUS", audio: "track9.mp3"  },
  { id: 10, title: "le secret d'Alihan",                 artist: "KAZANUS", audio: "track10.mp3" }
];

const listEl = document.getElementById("tracks");
listEl.innerHTML = TRACKS.map((t, i) => `
  <a class="track" data-id="${t.id}" href="track.html?id=${t.id}">
    <div class="track-num">
      <span class="num-text">${i + 1}</span>
      <span class="play-icon">▶</span>
    </div>
    <div class="track-info">
      <div class="track-name">${t.title}</div>
      <div class="track-artist">${t.artist}</div>
    </div>
    <div class="track-duration" data-dur>--:--</div>
    <div class="track-ornament">❦</div>
  </a>
`).join("");

const audio = document.getElementById("audio");
const player = document.getElementById("player");
const playBtn = document.getElementById("playBtn");
const npTitle = document.getElementById("npTitle");
const npArtist = document.getElementById("npArtist");
const seek = document.getElementById("seek");
const curTime = document.getElementById("curTime");
const durTime = document.getElementById("durTime");
const volume = document.getElementById("volume");

let currentIndex = -1;

function fmt(s) {
  if (!s || isNaN(s)) return "0:00";
  const m = Math.floor(s / 60);
  const r = Math.floor(s % 60).toString().padStart(2, "0");
  return m + ":" + r;
}

function playTrack(i) {
  if (i < 0 || i >= TRACKS.length) return;
  currentIndex = i;
  const t = TRACKS[i];
  audio.src = t.audio;
  audio.play().catch(e => console.error("Не удалось воспроизвести:", e));
  npTitle.textContent = t.title;
  npArtist.textContent = t.artist;
  player.classList.add("visible");
  playBtn.textContent = "⏸";

  document.querySelectorAll(".track").forEach(el => el.classList.remove("active"));
  const active = document.querySelector(`.track[data-id="${t.id}"]`);
  if (active) active.classList.add("active");
}

function togglePlay() {
  if (currentIndex < 0) { playTrack(0); return; }
  if (audio.paused) { audio.play(); playBtn.textContent = "⏸"; }
  else { audio.pause(); playBtn.textContent = "▶"; }
}

function nextTrack() {
  if (currentIndex < 0) return playTrack(0);
  playTrack((currentIndex + 1) % TRACKS.length);
}

function prevTrack() {
  if (currentIndex < 0) return playTrack(0);
  playTrack((currentIndex - 1 + TRACKS.length) % TRACKS.length);
}

function playFirst() { playTrack(0); }

document.querySelectorAll(".track").forEach((el, i) => {
  el.addEventListener("click", (e) => {
    e.preventDefault();
    if (currentIndex === i) togglePlay();
    else playTrack(i);
  });
  el.addEventListener("dblclick", () => {
    location.href = el.getAttribute("href");
  });
});

audio.addEventListener("timeupdate", () => {
  if (audio.duration) {
    seek.value = (audio.currentTime / audio.duration) * 100;
    curTime.textContent = fmt(audio.currentTime);
    durTime.textContent = fmt(audio.duration);
  }
});

audio.addEventListener("loadedmetadata", () => {
  durTime.textContent = fmt(audio.duration);
  if (currentIndex >= 0) {
    const el = document.querySelector(`.track[data-id="${TRACKS[currentIndex].id}"] [data-dur]`);
    if (el) el.textContent = fmt(audio.duration);
  }
});

audio.addEventListener("ended", nextTrack);
seek.addEventListener("input", () => {
  if (audio.duration) audio.currentTime = (seek.value / 100) * audio.duration;
});
volume.addEventListener("input", () => { audio.volume = volume.value; });

document.addEventListener("keydown", (e) => {
  if (e.code === "Space" && e.target.tagName !== "INPUT") {
    e.preventDefault();
    togglePlay();
  }
});
</script>
</body>
</html>
